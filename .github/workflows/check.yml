name: Regression checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci && npm run typecheck && npm test && npm run build
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: pip install -r requirements-dev.txt -r requirements-prepare.txt
      - run: python -m pytest -q
      - run: python scripts/prepare_benchmark_suites.py --task HumanEval/0 --task apps_plus_0581 --task apps_plus_5341
      - run: dotnet test VeriFlow.slnx
